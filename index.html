<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Graces Digital | Card 003</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icon Preto" type="image/svg+xml">
</head>
<body>
  <main class="digital-card">
    <section class="portrait">
      <img src="assets/perfil.png" alt="Foto de perfil">
      <div class="portrait__shade"></div>
    </section>

    <header class="identity">
      <div class="identity__line"></div>
      <h1>Graces Digital</h1>
      <p>Designer de Interiores</p>
    </header>

    <nav class="quick-links" aria-label="Links principais">
      <a class="quick-link" href="https://SEU-LINK-DE-TRABALHOS.com" target="_blank" rel="noopener noreferrer" aria-label="Abrir trabalhos">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 13.5h15l4 4h19v23H5z"/><path d="M5 13.5V8h14l4 4h18v5.5"/><path d="M11 23h27"/></svg>
        <span>Projetos</span>
      </a>
      <a class="quick-link" href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer" aria-label="Entrar em contato pelo WhatsApp">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 6h7l4 10-5 4c2 5 5 8 10 10l4-5 9 4v7c0 3-3 5-6 5C20 39 9 28 7 13 7 9 10 6 14 6Z"/><path d="M30 7c6 2 10 6 11 12M29 14c3 1 5 3 6 6"/></svg>
        <span>WHATSAPP</span>
      </a>
      <a class="quick-link" href="mailto:SEUEMAIL@gmail.com" aria-label="Enviar e-mail">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="38" height="30"/><path d="m6 11 18 16 18-16"/></svg>
        <span>GMAIL</span>
      </a>
      <a class="quick-link" href="https://www.instagram.com/digitalgraces/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="7" width="34" height="34" rx="9"/><circle cx="24" cy="24" r="8"/><circle class="svg-dot" cx="34" cy="14" r="2"/></svg>
        <span>INSTAGRAM</span>
      </a>
    </nav>

    <footer class="card-footer">
      <span class="footer-mark"></span>
      <p>CLIQUE NOS ÍCONES PARA INTERAGIR</p>
      <span class="footer-mark"></span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
